name: ore-stt

on:
  push:
    paths:
      - "ore-stt/**"
      - ".github/workflows/ore-stt.yml"
  pull_request:
    paths:
      - "ore-stt/**"
      - ".github/workflows/ore-stt.yml"

defaults:
  run:
    working-directory: ore-stt

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "ore-stt/uv.lock"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Generate gRPC stubs
        run: make proto

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest -m "not e2e" tests/

  docker:
    name: build image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ore-stt:ci .
        working-directory: ore-stt
