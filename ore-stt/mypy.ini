[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
disallow_untyped_decorators = True
ignore_missing_imports = False

[mypy-nemo.*]
ignore_missing_imports = True

[mypy-librosa.*]
ignore_missing_imports = True

[mypy-soundfile.*]
ignore_missing_imports = True

[mypy-silero_vad.*]
ignore_missing_imports = True

[mypy-ore_stt.grpc.generated.*]
ignore_errors = True

# protoc stubs are generated into grpc/generated/ (gitignored) and import each
# other as the top-level `ore.stt.v1` package; not on mypy's search path.
[mypy-ore.*]
ignore_missing_imports = True

[mypy-grpc.*]
ignore_missing_imports = True
