[project]
name = "ore-stt"
version = "0.1.0"
description = "Speech-to-text service for the Ore agent."
requires-python = ">=3.11,<3.12"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=5.0",
    "nemo-toolkit[asr]>=2.0",
    "torch>=2.2",
    "soundfile>=0.12",
    "librosa>=0.10",
    "numpy>=1.26,<2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "silero-vad>=5.0",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "grpcio-testing>=1.62",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-protobuf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ore_stt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end test that loads the real model (deselect with -m 'not e2e')",
]
